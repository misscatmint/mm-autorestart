name: Build
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Builds output/mm-1.12 (SourceHook) and output/mm-2.0 (KHook)
      - name: Build inside container
        run: make build

      - name: Upload MM:S 1.12 artifact
        uses: actions/upload-artifact@v7
        with:
          name: autorestart-linux-mm-1.12
          path: output/mm-1.12/*

      - name: Upload MM:S 2.0 artifact
        uses: actions/upload-artifact@v7
        with:
          name: autorestart-linux-mm-2.0
          path: output/mm-2.0/*

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Zip artifacts
        run: |
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            (cd "$dir" && zip -r "$GITHUB_WORKSPACE/$name.zip" .)
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --generate-notes \
            *.zip
